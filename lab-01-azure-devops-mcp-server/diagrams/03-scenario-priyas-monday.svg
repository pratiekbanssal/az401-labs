<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Helvetica, Arial, sans-serif">
<rect width="800" height="600" fill="#ffffff"/>
<defs>
<marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e1e1e"/></marker>
</defs>
<text x="40" y="54" font-size="30" font-weight="700" fill="#1e1e1e">The scenario: Priya's Monday morning</text>
<text x="40" y="83" font-size="17" fill="#555555">A customer emails: "My order total is wrong when I use a discount code."</text>
<rect x="30" y="130" width="170" height="90" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
<text x="115.0" y="159.8" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1e1e">Priya</text>
<text x="115.0" y="180.6" text-anchor="middle" font-size="16" fill="#1e1e1e">developer at a</text>
<text x="115.0" y="201.4" text-anchor="middle" font-size="16" fill="#1e1e1e">small online shop</text>
<line x1="200" y1="160" x2="250" y2="160" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m0)"/>
<rect x="250" y="120" width="520" height="72" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="510.0" y="150.9" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1e1e">1. "What bugs are assigned to me?"</text>
<text x="510.0" y="173.0" text-anchor="middle" font-size="17" fill="#1e1e1e">Copilot finds the discount bug in Boards</text>
<line x1="510" y1="192" x2="510" y2="212" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m0)"/>
<rect x="250" y="212" width="520" height="72" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="510.0" y="242.9" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1e1e">2. "Is anyone already fixing it?"</text>
<text x="510.0" y="265.0" text-anchor="middle" font-size="17" fill="#1e1e1e">Copilot finds an open pull request in Repos</text>
<line x1="510" y1="284" x2="510" y2="304" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m0)"/>
<rect x="250" y="304" width="520" height="72" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="510.0" y="334.9" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1e1e">3. "What does our release checklist say?"</text>
<text x="510.0" y="357.0" text-anchor="middle" font-size="17" fill="#1e1e1e">Copilot reads the page in the Wiki</text>
<line x1="510" y1="376" x2="510" y2="396" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m0)"/>
<rect x="250" y="396" width="520" height="72" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="510.0" y="426.9" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1e1e">4. "Link the PR to the bug and add a note."</text>
<text x="510.0" y="449.0" text-anchor="middle" font-size="17" fill="#1e1e1e">Copilot updates Boards for her</text>
<text x="30" y="276" font-size="16" fill="#1971c2">Steps 1-3: reading</text>
<text x="30" y="436" font-size="16" fill="#2b8a3e">Step 4: changing</text>
<rect x="250" y="500" width="520" height="60" rx="12" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
<text x="510.0" y="536.3" text-anchor="middle" font-size="18" fill="#1e1e1e">One chat instead of clicking through three pages.</text>
